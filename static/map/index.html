<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FNAL Muon Collider — Corridor-Aligned Siting</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../vendor/leaflet.css">
<style>
  html, body, #map { height: 100%; margin: 0; background: #eae6dd; }
  .legend { background: rgba(255,255,255,.94); padding: 10px 14px; border-radius: 6px;
            font: 13px/1.55 Georgia, serif; box-shadow: 0 1px 5px rgba(0,0,0,.3); }
  .legend .sw { display: inline-block; width: 22px; height: 3px; margin-right: 6px; vertical-align: middle; }
  .legend select { font: inherit; font-size: 12px; margin-top: 6px; width: 100%;
                   padding: 2px 3px; border: 1px solid #c9c1ae; border-radius: 4px; }
  .leaflet-container { font: 13px/1.5 Georgia, serif; }
  .leaflet-pins-pane svg { filter: drop-shadow(0 1px 2.5px rgba(0,0,0,.5)); }
</style>
</head>
<body>
<div id="map"></div>
<script src="../vendor/leaflet.js"></script>
<script src="layout_data.js"></script>
<script>
const map = L.map('map', { zoomSnap: 0.25, zoomDelta: 0.5 }).setView([41.95, -88.24], 11);
L.control.scale({ imperial: true, metric: true }).addTo(map);

// CARTO basemaps: a label-free base plus a labels-only overlay, so place names
// draw above the accelerator geometry. {r} pulls @2x tiles on high-DPI screens.
const CARTO_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' +
                   ' contributors &copy; <a href="https://carto.com/attributions">CARTO</a>';
const BASEMAPS = {
  positron: { base: 'light_nolabels', labels: 'light_only_labels' },
  voyager:  { base: 'rastertiles/voyager_nolabels', labels: 'rastertiles/voyager_only_labels' },
  dark:     { base: 'dark_nolabels', labels: 'dark_only_labels' },
};
map.createPane('basePane').style.zIndex = 200;
const labelPane = map.createPane('labels');
labelPane.style.zIndex = 450; labelPane.style.pointerEvents = 'none';
map.createPane('pins').style.zIndex = 470;
const pinRenderer = L.svg({ pane: 'pins' });

const carto = (style, pane) => L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/{style}/{z}/{x}/{y}{r}.png',
  { style, pane, subdomains: 'abcd', maxZoom: 20, attribution: CARTO_ATTR });

let baseTiles, labelTiles;
function setBasemap(name) {
  const bm = BASEMAPS[name] || BASEMAPS.positron;
  if (baseTiles) map.removeLayer(baseTiles);
  if (labelTiles) map.removeLayer(labelTiles);
  baseTiles = carto(bm.base, 'basePane').addTo(map);
  labelTiles = carto(bm.labels, 'labels').addTo(map);
}
const prefersDark = window.matchMedia &&
  window.matchMedia('(prefers-color-scheme: dark)').matches;
setBasemap(prefersDark ? 'dark' : 'positron');

const styles = {
  collider: { color: '#b3261e', weight: 3 },
  rcs34:    { color: '#7b2d8b', weight: 2.5, dashArray: '8 5' },
  rcs12:    { color: '#c77b21', weight: 2.5, dashArray: '3 5' },
};

L.geoJSON(COMED, { style: { color: '#3a6ea5', weight: 2, opacity: .75 } })
  .bindTooltip('ComEd corridor (OSM)').addTo(map);

const pointStyle = f => {
  const n = f.properties.name || '';
  const isDet = n.startsWith('Neutrino detector'), isIP = n.startsWith('Interaction');
  return {
    radius: isDet ? 8 : isIP ? 7.5 : 5.5, color: '#fff', weight: 2,
    fillColor: isDet ? '#0b6e4f' : isIP ? '#b3261e' : '#8a1c12',
    fillOpacity: 1, renderer: pinRenderer,
  };
};

L.geoJSON(LAYOUT, {
  style: f => {
    if (f.geometry.type === 'Point') return pointStyle(f);
    if (f.properties.ring) return styles[f.properties.ring];
    if (f.properties.role) return { color: '#0b6e4f', weight: 3, dashArray: '1 7' };
    return { color: '#555', weight: 2, fillOpacity: 0.04, dashArray: '6 4' };
  },
  pointToLayer: (f, latlng) => L.circleMarker(latlng, pointStyle(f)),
  onEachFeature: (f, l) => l.bindPopup(
    `<b>${f.properties.name || ''}</b><br><pre style="margin:0;font-size:11px">${
      JSON.stringify(f.properties, null, 1).slice(1, -1)}</pre>`)
}).addTo(map);

const legend = L.control({ position: 'topright' });
legend.onAdd = () => {
  const d = L.DomUtil.create('div', 'legend');
  d.innerHTML = `<b>Corridor-aligned muon collider @ FNAL</b><br>
  <span class="sw" style="background:#b3261e"></span>Collider ring (10 TeV, −100 m)<br>
  <span class="sw" style="background:#7b2d8b"></span>RCS3/4 tunnel (−80 m)<br>
  <span class="sw" style="background:#c77b21"></span>RCS1/2 tunnel (−60 m)<br>
  <span class="sw" style="background:#0b6e4f"></span>ν corridor → detector (9.3 km)<br>
  <span class="sw" style="background:#3a6ea5"></span>ComEd Aurora–Wayne ROW<br>
  <span class="sw" style="background:#8a1c12;height:8px;width:8px;border-radius:50%"></span>
  plume exit points (by ring pitch)<br>
  <small>generated by tools/corridor_layout.py</small>
  <select id="basemap">
    <option value="positron">Positron — light</option>
    <option value="voyager">Voyager — roads &amp; places</option>
    <option value="dark">Dark Matter</option>
  </select>`;
  L.DomEvent.disableClickPropagation(d);
  d.querySelector('#basemap').value = prefersDark ? 'dark' : 'positron';
  d.querySelector('#basemap').addEventListener('change', e => setBasemap(e.target.value));
  return d;
};
legend.addTo(map);
</script>
</body>
</html>
