<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FNAL Muon Collider — Corridor-Aligned Siting</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body, #map { height: 100%; margin: 0; }
  .legend { background: rgba(255,255,255,.92); padding: 10px 14px; border-radius: 6px;
            font: 13px/1.5 Georgia, serif; box-shadow: 0 1px 5px rgba(0,0,0,.35); }
  .legend .sw { display: inline-block; width: 22px; height: 3px; margin-right: 6px; vertical-align: middle; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="layout_data.js"></script>
<script>
const map = L.map('map').setView([41.95, -88.24], 11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  { attribution: '&copy; OpenStreetMap contributors' }).addTo(map);

const styles = {
  collider: { color: '#b3261e', weight: 3 },
  rcs34:    { color: '#7b2d8b', weight: 2.5, dashArray: '8 5' },
  rcs12:    { color: '#c77b21', weight: 2.5, dashArray: '3 5' },
};

L.geoJSON(COMED, { style: { color: '#3a6ea5', weight: 1.5, opacity: .7 } })
  .bindTooltip('ComEd corridor (OSM)').addTo(map);

L.geoJSON(LAYOUT, {
  style: f => {
    if (f.properties.ring) return styles[f.properties.ring];
    if (f.properties.role) return { color: '#0b6e4f', weight: 3, dashArray: '1 7' };
    return { color: '#555', weight: 2, fillOpacity: 0.03 };
  },
  pointToLayer: (f, latlng) => {
    const n = f.properties.name || '';
    const isDet = n.startsWith('Neutrino detector');
    const isIP = n.startsWith('Interaction');
    return L.circleMarker(latlng, {
      radius: isDet ? 8 : isIP ? 7 : 5,
      color: isDet ? '#0b6e4f' : isIP ? '#b3261e' : '#8a1c12',
      fillColor: isDet ? '#0b6e4f' : isIP ? '#b3261e' : '#e0a99f',
      fillOpacity: .9
    });
  },
  onEachFeature: (f, l) => l.bindPopup(
    `<b>${f.properties.name || ''}</b><br><pre style="margin:0;font-size:11px">${
      JSON.stringify(f.properties, null, 1).slice(1, -1)}</pre>`)
}).addTo(map);

const legend = L.control({ position: 'topright' });
legend.onAdd = () => {
  const d = L.DomUtil.create('div', 'legend');
  d.innerHTML = `<b>Corridor-aligned muon collider @ FNAL</b><br>
  <span class="sw" style="background:#b3261e"></span>Collider ring (10 TeV, −100 m)<br>
  <span class="sw" style="background:#7b2d8b"></span>RCS3/4 tunnel (−80 m)<br>
  <span class="sw" style="background:#c77b21"></span>RCS1/2 tunnel (−60 m)<br>
  <span class="sw" style="background:#0b6e4f"></span>ν corridor → detector (8.7 km)<br>
  <span class="sw" style="background:#3a6ea5"></span>ComEd Aurora–Wayne ROW<br>
  <span class="sw" style="background:#8a1c12;height:8px;width:8px;border-radius:50%"></span>
  plume exit points (by ring pitch)<br>
  <small>generated by tools/corridor_layout.py</small>`;
  return d;
};
legend.addTo(map);
</script>
</body>
</html>
